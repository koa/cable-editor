name: Build and Publish

on:
  push:
    branches: [ "master" ]
    tags: [ 'v*.*.*' ]
  # Allows starting manually
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Write access for the GitHub Container Registry (GHCR)
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # A `vX.Y.Z` tag (pushed by release.yml, or by hand) is a real release: image and chart
      # get that version. Anything else (a push to master, a manual run) is a snapshot, named
      # after the commit, as Helm needs valid semver even for that.
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            IMAGE_TAG="$VERSION"
          else
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            VERSION="0.0.0-snapshot.${SHORT_SHA}"
            IMAGE_TAG="sha-${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      # --- HELM PACKAGE & PUSH ---
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.2

      - name: Package and Push Helm Chart
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Replace the "latest" tag in values.yaml with the Docker tag just built
          sed -i "s/tag: .*/tag: \"${{ steps.version.outputs.image_tag }}\"/" cable-editor-chart/values.yaml

          # Package the chart with the determined version (same for chart and app version,
          # see cable-editor-chart/Chart.yaml)
          helm package cable-editor-chart --version "${VERSION}" --app-version "${VERSION}" --destination .

          # Prepare the push
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          CHART_PKG=$(ls cable-editor-chart-*.tgz)

          # Log into Helm (uses the same token)
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin
          helm push $CHART_PKG oci://${{ env.REGISTRY }}/$REPO_OWNER

      # --- DOCKER BUILD & PUSH ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            # Generates a tag like 'sha-a1b2c3d'
            type=sha,format=short
            # Only on a 'vX.Y.Z' tag: generates e.g. '1.2.3' (without the leading 'v')
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
