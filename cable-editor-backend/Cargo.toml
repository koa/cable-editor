[package]
name = "cable-editor-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
async-graphql = { version = "7.0", features = ["dataloader", "chrono"] }
serde = "1.0"
config = "0.15"

diesel = { version = "2.3", features = ["postgres", "chrono", "serde_json"] }
chrono = "0.4"
diesel-derive-enum = { version = "2.1.0", features = ["postgres"] }
dotenvy = "0.15"
diesel-async = { version = "0.9", features = ["postgres","deadpool","migrations"] }
postgis_diesel = { version = "3.1" }
diesel_migrations = "2.3"

thiserror = "2.0"

log = "0.4"

async-recursion = "1.1"
itertools = "0.15"
cynic = { version = "3", features = ["http-reqwest"] }
#netbox = "0.8.0"
reqwest = { version = "0.13", features = ["rustls"] }
tokio = { version = "1.53.1", features = ["sync", "time", "macros"] }
serde_json = "1.0.151"
cable-editor-common = { path = "../cable-editor-common", features = ["async-graphql"] }
quick-xml = "0.42.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sha2 = "0.10"
base64 = "0.22"


[build-dependencies]
cynic-codegen = { version = "3" }
