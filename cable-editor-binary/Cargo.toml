[package]
name = "cable-editor-binary"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-web-static-files = "4"
static-files = "0.2"
cable-editor-backend = { path = "../cable-editor-backend" }
async-graphql = "7.0"
async-graphql-actix-web = "7.0"
env_logger = "0.11"
log = "0.4"
prometheus = "0.14"
actix-web-prometheus = { version = "0.1", features = ["process"], git = "https://github.com/koa/actix-web-prometheus" }
thiserror = "2.0"
actix-4-jwt-auth = { version = "1.2" }
tracing-actix-web = "0.7"
serde_json = "1.0"
reqwest = { version = "0.13.4", features = ["rustls", "json"] }
cached = { version = "2", features = ["async", "cached_proc_macro"] }