apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cable-editor-chart.fullname" . }}
  labels:
    {{- include "cable-editor-chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cable-editor-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cable-editor-chart.selectorLabels" . | nindent 8 }}
      {{- if not .Values.config.netboxTokenSecret.name }}
      annotations:
        # Restart the pods when the token in the chart's Secret changes
        checksum/netbox-token: {{ include (print $.Template.BasePath "/netbox-token-secret.yaml") . | sha256sum }}
      {{- end }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http-api
              containerPort: 8080
              protocol: TCP
            - name: http-mgmt
              containerPort: 9090
              protocol: TCP
          # Liveness & Readiness über den Mgmt-Port
          livenessProbe:
            httpGet:
              path: /health
              port: http-mgmt
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http-mgmt
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          env:
            # Struct-Feld: auth_client_id
            - name: APP__OAUTH__AUTH_CLIENT_ID
              value: {{ .Values.config.authClientId | quote }}
            # Struct-Feld: auth_issuer
            - name: APP__OAUTH__AUTH_ISSUER
              value: {{ .Values.config.authIssuer | quote }}
            {{- with .Values.config.userInfoUrl }}
            - name: APP__OAUTH__USER_INFO_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.config.authScopes }}
            - name: APP__OAUTH__AUTH_SCOPES
              value: {{ . | quote }}
            {{- end }}
            - name: APP__OAUTH__PLANNER_GROUPS
              value: {{ .Values.config.plannerGroups | quote }}
            - name: APP__OAUTH__ADMIN_GROUPS
              value: {{ .Values.config.adminGroups | quote }}
            # Struct-Feld: server_port
            - name: APP__OAUTH__SERVER_PORT
              value: {{ .Values.config.serverPort | quote }}
            # Struct-Feld: server_mgmt_port
            - name: APP__OAUTH__SERVER_MGMT_PORT
              value: {{ .Values.config.serverMgmtPort | quote }}
            # Struct-Feld: server_bind_address
            - name: APP__OAUTH__SERVER_BIND_ADDRESS
              value: {{ .Values.config.serverBindAddress | quote }}
            - name: APP__NETBOX__URL
              value: {{ .Values.config.netboxUrl | quote }}
            - name: APP__NETBOX__TOKEN
              valueFrom:
                secretKeyRef:
                  {{- with .Values.config.netboxTokenSecret }}
                  name: {{ .name | default (printf "%s-netbox-token" (include "cable-editor-chart.fullname" $)) | quote }}
                  key: {{ if .name }}{{ .key | quote }}{{ else }}"token"{{ end }}
                  {{- end }}
            - name: APP__NETBOX__PROVIDER_ID
              value: {{ .Values.config.netboxProviderId | quote }}
            - name: APP__NETBOX__TYPE_ID
              value: {{ .Values.config.netboxTypeId | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: DATABASE_URL
              {{- if .Values.config.databaseSecret}}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.databaseSecret | squote}}
                  key: "uri"
              {{- else}}
              value: {{ .Values.config.databaseUrl | quote }}
              {{- end}}