{{- if not .Values.config.netboxTokenSecret.name }}
# The Netbox token given as value, so the Deployment only references it
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cable-editor-chart.fullname" . }}-netbox-token
  labels:
    {{- include "cable-editor-chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ required "Set config.netboxToken or config.netboxTokenSecret.name" .Values.config.netboxToken | quote }}
{{- end }}
