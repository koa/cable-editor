apiVersion: v1
kind: Service
metadata:
  name: {{ include "cable-editor-chart.fullname" . }}
  labels:
    {{- include "cable-editor-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.apiPort }}
      targetPort: http-api
      protocol: TCP
      name: http-api
    - port: {{ .Values.service.mgmtPort }}
      targetPort: http-mgmt
      protocol: TCP
      name: http-mgmt
  selector:
    {{- include "cable-editor-chart.selectorLabels" . | nindent 4 }}