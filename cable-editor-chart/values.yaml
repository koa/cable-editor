replicaCount: 1


serviceAccount:
  create: true
  annotations: {}
  # Wenn leer, wird der Name über das Helm-Template generiert
  name: ""

image:
  repository: ghcr.io/koa/cable-editor
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  apiPort: 8080
  mgmtPort: 9090

gateway:
  enabled: true
  parentRefs:
    - name: mein-gateway
      namespace: default
  hostnames:
    - "cable-editor.meinedomain.local"

podMonitor:
  enabled: true
  interval: 15s
  path: /metrics
  # Manche Prometheus-Setups erfordern spezielle Labels,
  # damit der Operator den PodMonitor erkennt (z.B. release: prometheus).
  labels: {}

# Konfiguration deiner Anwendung (Umgebungsvariablen)
config:
  logLevel: "info"
  # Diese Werte müssen beim Deployment überschrieben werden (z.B. über eine CI/CD Pipeline oder Helm Secrets)
  databaseSecret: "cable-editor-db-app"
  databaseUrl: "postgres://user:password@localhost:5432/cable_editor"
  authIssuer: "https://login.berg-turbenthal.ch"
  # Client ID of the app at the OIDC provider
  authClientId: "cable-editor"
  # Optional: userinfo endpoint (default: from the issuer's OIDC discovery)
  userInfoUrl: ""
  # Optional: space separated scopes the frontend requests (default: "openid profile groups")
  authScopes: ""
  # OIDC groups (space separated, e.g. the group names in Pocket ID, not their friendly names)
  # whose members may plan and change cables, panels and ports; every logged in user may read
  plannerGroups: ""
  # ... and whose members may also implement plans, sync them to Netbox and delete cables
  adminGroups: ""
  serverBindAddress: "0.0.0.0"
  serverPort: "8080"
  serverMgmtPort: "9090"
  # URL der Netbox-Instanz (ohne /graphql)"
  netboxUrl: "http://netbox.local/"
  # Token der Netbox-Instanz, nie als Klartext im Deployment:
  # entweder ein bestehendes Secret (empfohlen, z.B. über Sealed Secrets oder External Secrets) ...
  netboxTokenSecret:
    name: ""
    key: "token"
  # ... oder der Token selbst, das Chart legt dafür ein Secret an
  netboxToken: ""
  # Provider ID für die Circuits (Transportnetze)
  netboxProviderId: 1
  # Typ der Circuits
  netboxTypeId: 1