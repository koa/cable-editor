[package]
name = "cable-editor-frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
yew = { version = "0.22", features = ["csr"] }
yew-nested-router = { version = "0.8" }
patternfly-yew = { version = "0.7" }

reqwest = { version = "0.13", feature = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
wasm-logger = "0.2"
web-sys = "0.3"
thiserror = "2.0"

yew-oauth2 = "0.13"
lazy_static = "1.5"
console_error_panic_hook = "0.1"

cynic = { version = "3", features = ["http-reqwest"] }

[build-dependencies]
cable-editor-backend = { path = "../cable-editor-backend" }
anyhow = "1.0"
cynic-codegen = { version = "3" }
