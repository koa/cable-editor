[package]
name = "cable-editor-frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
yew = { version = "0.23.0", features = ["csr"] }
yew-nested-router = { version = "0.9.0" }
patternfly-yew = { version = "0.8" }
tokio = { version = "1.53.0", features = ["sync"] }

reqwest = { version = "0.13", feature = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
wasm-logger = "0.2"
web-sys = "0.3"
thiserror = "2.0"

yew-oauth2 = { version = "0.14",features = ["openid"] }
lazy_static = "1.5"
console_error_panic_hook = "0.1"

cynic = { version = "3", features = ["http-reqwest"] }

leaflet = "0.5.0"
gloo-utils = "0.2.0"
base64 = "0.22"

futures = "0.3"
ouroboros = "0.18"
uuid = { version = "1.24.0", features = ["v4", "js"] }
strum = { version = "0.28.0", features = ["derive"] }

[build-dependencies]
cable-editor-backend = { path = "../cable-editor-backend" }
anyhow = "1.0"
cynic-codegen = { version = "3" }
