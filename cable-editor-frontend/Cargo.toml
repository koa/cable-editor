[package]
name = "cable-editor-frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
yew = { version = "0.23.0", features = ["csr"] }
yew-nested-router = { version = "0.9.0" }
patternfly-yew = { version = "0.8" }
tokio = { version = "1.53.0", features = ["sync"] }

reqwest = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
wasm-logger = "0.2"
web-sys = { version = "0.3", features = ["Blob", "CanvasRenderingContext2d", "Coordinates", "Document", "DomParser", "Element", "File", "FileList", "FontFaceSet", "Geolocation", "HtmlCanvasElement", "HtmlCollection", "HtmlInputElement", "Navigator", "Position", "PositionError", "PositionOptions", "Storage", "SupportedType", "TextMetrics", "Window"] }
thiserror = "2.0"

yew-oauth2 = { version = "0.14",features = ["openid"] }
console_error_panic_hook = "0.1"

cynic = { version = "3", features = ["http-reqwest"] }

leaflet = "0.5.0"
gloo-utils = "0.2.0"
gloo-timers = "0.3"

futures = "0.3"
uuid = { version = "1.24.0", features = ["v4", "js"] }
strum = { version = "0.28.0", features = ["derive"] }
itertools = "0.15"
brady-web-sdk = { git = "https://git.panter.ch/open-source/brady-web-sdk-rs.git" }

[build-dependencies]
cable-editor-backend = { path = "../cable-editor-backend" }
anyhow = "1.0"
cynic-codegen = { version = "3" }
