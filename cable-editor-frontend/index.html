<!DOCTYPE html>
<html lang="de">
<head>
    <!-- Must precede any module script -->
    <script type="importmap">
        { "imports": { "brady-web-sdk": "/brady-web-sdk/bundle.js" } }
    </script>
    <!-- PatternFly's dark theme follows the system setting, set before the first render so the
         page doesn't flash light. Not while printing: paper stays light. -->
    <script>
        (() => {
            const dark = matchMedia("(prefers-color-scheme: dark)");
            const apply = (on) => document.documentElement.classList.toggle("pf-v6-theme-dark", on);
            apply(dark.matches);
            dark.addEventListener("change", () => apply(dark.matches));
            addEventListener("beforeprint", () => apply(false));
            addEventListener("afterprint", () => apply(dark.matches));
        })();
    </script>
    <!-- resizes-content: the on-screen keyboard shrinks the layout, so dialogs stay above it -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Cable Editor</title>
    <!-- Installable as an app (manifest only, no service worker: the app needs the server anyway) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link data-trunk rel="copy-file" href="assets/manifest.webmanifest">
    <link data-trunk rel="copy-dir" href="assets/icons">
    <link data-trunk rel="scss" href="assets/style.scss">
    <!-- This path needs to be here, otherwise icons won't render correctly -->
    <link data-trunk rel="copy-dir" href="node/node_modules/@patternfly/patternfly/assets" data-target-path="assets/">
    <!--<link data-trunk rel="copy-dir" href="assets/images">-->
    <link data-trunk rel="copy-dir" href="node/node_modules/@fortawesome/fontawesome-free/webfonts">
    <link data-trunk rel="copy-dir" href="node/node_modules/leaflet/dist/images">
    <link data-trunk rel="css" href="node/node_modules/leaflet/dist/leaflet.css">
    <script data-trunk src="node/node_modules/leaflet/dist/leaflet.js"></script>
    <!-- Label font, declared in style.scss -->
    <link data-trunk rel="copy-file" href="node/node_modules/@fontsource/barlow/files/barlow-latin-700-normal.woff2">
    <!-- Brady SDK loads its wasm and pdf.js relative to bundle.js -->
    <link data-trunk rel="copy-dir" href="node/node_modules/@bradycorporation/brady-web-sdk/dist" data-target-path="brady-web-sdk">

</head>
<body>
</body>
</html>
